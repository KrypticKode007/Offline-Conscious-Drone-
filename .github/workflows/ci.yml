name: Drone Architecture Core CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Build Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Build C++ Native Core via CMake
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build .

    - name: Copy Shared Library to Core Source Root
      run: |
        cp build/libstabilizer.so . || cp build/libstabilizer.dylib . || cp build/stabilizer_core.so . || cp build/libstabilizer* .

    - name: Run Orchestrator Pipeline Verification Suite
      run: |
        if [ -f "orchestrator_bridge.py" ]; then
          python3 orchestrator_bridge.py
        else
          echo "Warning: orchestrator_bridge.py not found at root layout."
        fi
        
