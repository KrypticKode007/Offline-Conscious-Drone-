name: Drone Architecture Core CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Build Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake sqlite3 libsqlite3-dev

    - name: Build C++ Native Core via CMake
      run: |
        mkdir -p build
        cd build
        cmake ..
        cmake --build .

    - name: Copy Shared Library to Core Source Root
      run: |
        if [ -f "build/libstabilizer.so" ]; then
          cp build/libstabilizer.so .
        elif [ -f "build/libstabilizer.dylib" ]; then
          cp build/libstabilizer.dylib .
        else
          echo "Compiling directly from source file fallback structure..."
          g++ -O3 -shared -fPIC -std=c++11 stabilizer_core.hpp -o libstabilizer.so
        fi

    - name: Run Core Orchestrator Live Loop Verification
      run: |
        if [ -f "orchestrator_bridge.py" ]; then
          python3 orchestrator_bridge.py
        else
          echo "Error: orchestrator_bridge.py core target is missing."
          exit 1
        fi

    - name: Execute Database Integrity Diagnostics Test
      run: |
        if [ -f "extract_analytics.py" ]; then
          python3 extract_analytics.py
        else
          echo "Error: extract_analytics.py verification utility is missing."
          exit 1
        fi
        
